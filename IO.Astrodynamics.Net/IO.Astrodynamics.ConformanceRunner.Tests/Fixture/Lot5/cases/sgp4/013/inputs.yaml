tolerances_override:
  sgp4_icrf_position_km:
    abs_tol: 0.00025
    rel_tol: 0.0
    justification: >-
      The ICRF golden is the golden TEME state through GMAT R2026a's TEME axes, which carry, from 1997-02-27, the
      kinematic terms of the 1994 equation of the equinoxes that the definition of spec.md 2.1 leaves out (finding
      T1 of tools/legacy_goldens/README.md); a runner exact to the definition sits at E_ref from the golden, and the
      definition allows IAU 2006/2000A or 2006/2000B (S_nut). Measured on the 25 samples (2026-11-08, Linux x86_64,
      GMAT R2026a and pyerfa 2.0.1.5): E_ref = |GMAT - the CIP route| per component up to 0.000125 km (sample 10),
      S_nut up to 5.05e-06 km, CSPICE through the same route up to 2.41e-09 km; T_op 0.0001 km. T = max(T_op,
      ceil2(2 max(S_gen, E_2nd, E_ref, S_nut))) = 0.00025 km (spec.md 6.4).
