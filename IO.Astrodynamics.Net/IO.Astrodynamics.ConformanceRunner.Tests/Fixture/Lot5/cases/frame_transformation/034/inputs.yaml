id: "frame_transformation_teme_icrf_geo_2016_034"
schema_version: "v1"
version: "0.1.0"
category: "frame_transformation"
created: "2026-11-08"
description: >
  TEME to ICRF of the geostationary state of 033 on 2016-01-01 00:00 UTC, where the sine of the lunar node almost
  vanishes: the kinematic terms GMAT carries are smallest there, the tightest test of the definition of spec.md 2.1.

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the frame of the golden (spec.md section 10)
  time_scale: "UTC"

inputs:
  epoch: "2016-01-01T00:00:00.000 UTC"
  from_frame: "TEME"
  to_frame: "ICRF"
  from_center: "Earth"
  to_center: "Earth"
  state:
    position_km: [36515.09512516707, 21081.999999999996, 10.0]
    velocity_km_s: [-1.5373337999999999, 2.662740249792931, 0.01]
  kernels: []

tolerances_override:
  position_km:
    abs_tol: 3.3e-5
    rel_tol: 0.0
    justification: >-
      GMAT R2026a's TEME axes (the golden) carry, from 1997-02-27, the kinematic terms of the 1994 equation of the
      equinoxes (0.00264 arcsec sin(node) + 0.000063 arcsec sin(2 node)), which the definition of spec.md 2.1 leaves
      out (finding T1 of tools/legacy_goldens/README.md), with the residual of its ICRF table; a runner exact to the
      definition sits at E_ref from the golden. The definition allows IAU 2006/2000A or 2006/2000B (S_nut).
      Measured: E_ref 1.61e-05 km (GMAT against the CIP route of spec.md 2.1; GMAT R2026a run of 2026-11-08),
      conditioning floor 4.68e-12 km, S_nut (IAU 2006/2000B minus 2006/2000A) 4.81e-07 km; CSPICE has no TEME frame
      and measures no E_CSPICE; T_op 1.0e-6 km. T = max(T_op, ceil2(2 max(E_ref, S_nut, floor))) = 3.3e-05.
  velocity_km_s:
    abs_tol: 2.4e-9
    rel_tol: 0.0
    justification: >-
      GMAT R2026a's TEME axes (the golden) carry, from 1997-02-27, the kinematic terms of the 1994 equation of the
      equinoxes (0.00264 arcsec sin(node) + 0.000063 arcsec sin(2 node)), which the definition of spec.md 2.1 leaves
      out (finding T1 of tools/legacy_goldens/README.md), with the residual of its ICRF table; a runner exact to the
      definition sits at E_ref from the golden. The definition allows IAU 2006/2000A or 2006/2000B (S_nut).
      Measured: E_ref 1.16e-09 km/s (GMAT against the CIP route of spec.md 2.1; GMAT R2026a run of 2026-11-08),
      conditioning floor 3.41e-16 km/s, S_nut (IAU 2006/2000B minus 2006/2000A) 6.28e-10 km/s; CSPICE has no TEME
      frame and measures no E_CSPICE; T_op 1.0e-9 km/s. T = max(T_op, ceil2(2 max(E_ref, S_nut, floor))) = 2.4e-09.
