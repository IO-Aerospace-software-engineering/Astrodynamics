id: "frame_transformation_teme_icrf_leo_2021_032"
schema_version: "v1"
version: "0.1.0"
category: "frame_transformation"
created: "2026-11-08"
description: >
  TEME to ICRF of a LEO state on 2021-03-20 11:58:50.814 UTC (12:00 TDB), where the kinematic terms of the 1994
  equation of the equinoxes that GMAT carries are near their maximum (spec.md 2.1).

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the frame of the golden (spec.md section 10)
  time_scale: "UTC"

inputs:
  epoch: "2021-03-20T11:58:50.814 UTC"
  from_frame: "TEME"
  to_frame: "ICRF"
  from_center: "Earth"
  to_center: "Earth"
  state:
    position_km: [7000.0, 1000.0, 500.0]
    velocity_km_s: [-0.5, 7.2, 1.1]
  kernels: []

tolerances_override:
  position_km:
    abs_tol: 0.00016
    rel_tol: 0.0
    justification: >-
      GMAT R2026a's TEME axes (the golden) carry, from 1997-02-27, the kinematic terms of the 1994 equation of the
      equinoxes (0.00264 arcsec sin(node) + 0.000063 arcsec sin(2 node)), which the definition of spec.md 2.1 leaves
      out (finding T1 of tools/legacy_goldens/README.md), with the residual of its ICRF table; a runner exact to the
      definition sits at E_ref from the golden. The definition allows IAU 2006/2000A or 2006/2000B (S_nut).
      Measured: E_ref 7.93e-05 km (GMAT against the CIP route of spec.md 2.1; GMAT R2026a run of 2026-11-08),
      conditioning floor 7.87e-13 km, S_nut (IAU 2006/2000B minus 2006/2000A) 6.58e-06 km; CSPICE has no TEME frame
      and measures no E_CSPICE; T_op 1.0e-6 km. T = max(T_op, ceil2(2 max(E_ref, S_nut, floor))) = 0.00016.
  velocity_km_s:
    abs_tol: 1.7e-7
    rel_tol: 0.0
    justification: >-
      GMAT R2026a's TEME axes (the golden) carry, from 1997-02-27, the kinematic terms of the 1994 equation of the
      equinoxes (0.00264 arcsec sin(node) + 0.000063 arcsec sin(2 node)), which the definition of spec.md 2.1 leaves
      out (finding T1 of tools/legacy_goldens/README.md), with the residual of its ICRF table; a runner exact to the
      definition sits at E_ref from the golden. The definition allows IAU 2006/2000A or 2006/2000B (S_nut).
      Measured: E_ref 8.1e-08 km/s (GMAT against the CIP route of spec.md 2.1; GMAT R2026a run of 2026-11-08),
      conditioning floor 8.11e-16 km/s, S_nut (IAU 2006/2000B minus 2006/2000A) 3.38e-09 km/s; CSPICE has no TEME
      frame and measures no E_CSPICE; T_op 1.0e-9 km/s. T = max(T_op, ceil2(2 max(E_ref, S_nut, floor))) = 1.7e-07.
