# ---------------------------------------------------------------------------
# tolerances.yaml — default pass/fail thresholds for every metric.
#
# Pass/fail logic is OR-based: a metric PASSES when EITHER threshold is met.
#
#   PASS  ⟺  |computed − golden| ≤ abs_tol
#          OR |computed − golden| / |golden| ≤ rel_tol
#
# Per-case overrides (tolerances_override in cases/*.yaml) take precedence
# over the values below.  See spec.md §6 for the full rule.
# ---------------------------------------------------------------------------

version: "1.0.0"

defaults:
  # Position — 1e-6 km = 1 mm
  position_km:
    abs_tol: 1.0e-6
    rel_tol: 1.0e-9

  # Velocity — 1e-9 km/s = 1 µm/s
  velocity_km_s:
    abs_tol: 1.0e-9
    rel_tol: 1.0e-9

  # Quaternion components — unit quaternions are tightly constrained;
  # 1e-10 corresponds to ~0.02 micro-arcseconds of pointing error.
  attitude_quaternion:
    abs_tol: 1.0e-10
    rel_tol: 1.0e-10

  # Angles — 1e-6 deg ≈ 3.6 milli-arcseconds
  angle_deg:
    abs_tol: 1.0e-6
    rel_tol: 1.0e-9

  # Eclipse entry/exit epoch — 10 ms is the minimum operationally
  # meaningful granularity for LEO eclipse prediction.
  eclipse_time_s:
    abs_tol: 1.0e-2
    rel_tol: 1.0e-6

  # Eclipse duration — 100 ms accounts for error accumulation at both
  # endpoints.  For long eclipses (~2000 s) rel_tol becomes the tighter gate.
  penumbra_duration_s:
    abs_tol: 1.0e-1
    rel_tol: 1.0e-5

  umbra_duration_s:
    abs_tol: 1.0e-1
    rel_tol: 1.0e-5

  # Propagator final position — component-wise
  propagator_position_km:
    abs_tol: 1.0e-6
    rel_tol: 1.0e-9

  # Propagator final velocity — component-wise
  propagator_velocity_km_s:
    abs_tol: 1.0e-9
    rel_tol: 1.0e-9

  # Geosynchronous orbit semi-major axis — 1e-3 km = 1 m
  semi_major_axis_km:
    abs_tol: 1.0e-3
    rel_tol: 1.0e-9

  # Eccentricity — circular orbit tolerance
  eccentricity:
    abs_tol: 1.0e-10
    rel_tol: 1.0e-6

  # ---- Lot 1: conversions without propagation (spec.md sections 6 and 11) --------------------------------------
  # One active threshold per key (#7): rel_tol 0 = absolute, abs_tol 0 = relative. Value: ceil2(2 max(E_run over
  # linux, windows, macos; E_ref, golden vs a 60-digit or CSPICE evaluation; conditioning floor)), measured 2026-10-25.
  oe_length_km:              # a, rp, ra, p; orbital_elements_hyperbolic_inbound_017 semi_major_axis_km: E_ref 1.34e-15
    abs_tol: 0.0
    rel_tol: 2.7e-15
  oe_eccentricity:           # e; orbital_elements_hyperbolic_outbound_016 eccentricity: E_run 6.66e-16 (windows)
    abs_tol: 1.4e-15
    rel_tol: 0.0
  oe_angle_deg:              # every orbital_elements angle; orbital_elements_polar_010 eccentric_anomaly_deg: E_run 1.08e-12 (windows)
    abs_tol: 2.2e-12
    rel_tol: 0.0
  oe_period_s:               # period (100 ns ticks in IO); orbital_elements_nearcircular_003 period_s: E_run 9.54e-08 (windows)
    abs_tol: 2.0e-7
    rel_tol: 0.0
  oe_energy_km2_s2:          # specific energy; orbital_elements_hyperbolic_inbound_017 specific_energy_km2_s2: E_ref 1.35e-15
    abs_tol: 0.0
    rel_tol: 2.8e-15
  oe_angular_momentum_km2_s: # vector h; orbital_elements_nearretrograde_012 angular_momentum_km2_s: E_run 2.67e-16 (windows)
    abs_tol: 0.0
    rel_tol: 5.4e-16
  oe_speed_km_s:             # periapsis and apoapsis speeds; orbital_elements_periapsis_013 apoapsis_speed_km_s: E_run 5.39e-16 (windows)
    abs_tol: 0.0
    rel_tol: 1.1e-15
  oe_mean_motion_rad_s:      # mean motion; orbital_elements_hyperbolic_inbound_017 mean_motion_rad_s: E_ref 1.95e-15
    abs_tol: 0.0
    rel_tol: 4.0e-15
  oe_equinoctial:            # f, g, h, k; orbital_elements_hyperbolic_outbound_016 mod_equinoctial_g: E_run 1.11e-15 (windows)
    abs_tol: 2.3e-15
    rel_tol: 0.0
  oe_position_km:            # vector, elements to state; orbital_elements_modeq2cart_highecc_152 position_km: E_run 1.12e-15 (windows)
    abs_tol: 0.0
    rel_tol: 2.3e-15
  oe_velocity_km_s:          # vector, elements to state; orbital_elements_kep2cart_e0p9_102 velocity_km_s: floor 1.86e-15
    abs_tol: 0.0
    rel_tol: 3.8e-15
  time_s:                    # time outputs not crossing TDB<->TT; time_conversion_tdb_005 tdb_s: floor 4.77e-07
    abs_tol: 9.6e-7
    rel_tol: 0.0
  time_tdb_s:                # time outputs crossing TDB<->TT; GMAT series - ERFA dtdb 37.5676 us + GMAT print 0.287 us
    abs_tol: 7.6e-5
    rel_tol: 0.0
  frame_position_km:         # vector; frame_transformation_itrf93_2016_008 position_km: E_run 9.05e-16 (windows)
    abs_tol: 0.0
    rel_tol: 1.9e-15
  frame_velocity_km_s:       # vector, absolute; frame_transformation_earth_to_moon_me_016 velocity_km_s: E_ref 2.34e-15
    abs_tol: 4.7e-15
    rel_tol: 0.0
  geodetic_latitude_deg:     # geodetic latitude; frame_transformation_geodetic_lat20_m10km_029 latitude_deg: E_run 2.57e-08 (windows)
    abs_tol: 5.2e-8
    rel_tol: 0.0
  geodetic_longitude_deg:    # geodetic longitude; frame_transformation_geodetic_lat70_20000km_030 longitude_deg: E_run 1.78e-14 (windows)
    abs_tol: 3.6e-14
    rel_tol: 0.0
  geodetic_altitude_km:      # geodetic altitude; frame_transformation_geodetic_lat70_20000km_030 altitude_km: E_run 1.38e-06 (windows)
    abs_tol: 2.8e-6
    rel_tol: 0.0
