id: "frame_transformation_moon_pa_llo_012"
schema_version: "v1"
version: "0.1.0"
category: "frame_transformation"
created: "2026-10-25"
description: >
  ICRF to MOON_PA of a low lunar orbit state (1838 km from the centre of the Moon).

metadata:
  ephemeris_kernel: "none"
  reference_frame: "MOON_PA"      # the frame of the golden (spec.md section 10)
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  from_frame: "ICRF"
  to_frame: "MOON_PA"
  from_center: "Moon"
  to_center: "Moon"
  state:
    position_km: [1838.0, 0.0, 0.0]
    velocity_km_s: [0.0, 1.0, 1.3]
  kernels: ["moon_pa_de421_1900-2050.bpc", "moon_080317.tf"]

tolerances_override:
  position_km:
    abs_tol: 0.0
    rel_tol: 2.3e-14
    justification: >-
      A state 1838 km from the Moon: GMAT loses 2e-11 to 4e-11 km on Moon-centred states (presumably through its
      Earth-centred internal state; not shown), well above the rounding of the transformation. Measured: E_ref
      1.1e-14 relative (GMAT against CSPICE with the same kernels; GMAT R2026a run of 2026-10-25), conditioning
      floor 1.11e-16 relative, E_run linux 1.1e-14, windows 1.1e-14, macos 1.1e-14 (IO.Astrodynamics minus golden,
      2026-10-25). T = ceil2(2 max(E_run, E_ref, floor)) = 2.3e-14.
