id: "frame_transformation_geodetic_near_pole_024"
schema_version: "v1"
version: "0.1.0"
category: "frame_transformation"
created: "2026-10-25"
description: >
  Geodetic latitude, longitude and altitude of a body-fixed position 1.118 km from the polar axis, on the ellipsoid
  of the case (the Earth radii of pck00011).

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ITRF93"       # the frame of the golden (spec.md section 10)
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  from_frame: "ITRF93"
  to_frame: "ITRF93"
  from_center: "Earth"
  to_center: "Earth"
  state:
    position_km: [1.0, 0.5, 6400.0]
    velocity_km_s: [0.0, 0.0, 0.0]
  ellipsoid: {equatorial_radius_km: 6378.1366, flattening: 0.0033528131084554157}
  kernels: []

tolerances_override:
  longitude_deg:
    abs_tol: 1.4e-11
    rel_tol: 0.0
    justification: >-
      Close to the polar axis (1.118 km from it), GMAT's longitude is coarser than the conditioning of the case.
      Measured: E_ref 6.99e-12 deg (the golden against the 50-digit evaluation; GMAT R2026a run of 2026-10-25),
      conditioning floor 3.6e-15 deg, E_run linux 6.99e-12, windows 6.99e-12, macos 6.99e-12 (IO.Astrodynamics minus
      golden, 2026-10-25). T = ceil2(2 max(E_run, E_ref, floor)) = 1.4e-11.

# Outputs left out of the golden (written by tools/gmat_goldens/generate.py; spec.md section 11):
#   position_km, velocity_km_s: identity transformation (ITRF93 to ITRF93); the case checks the geodetic outputs
