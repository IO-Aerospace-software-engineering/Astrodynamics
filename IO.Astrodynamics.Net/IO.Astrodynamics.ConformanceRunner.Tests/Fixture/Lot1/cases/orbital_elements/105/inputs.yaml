id: "orbital_elements_kep2cart_e0p999_ta150_105"
schema_version: "v1"
version: "0.1.0"
category: "orbital_elements"
created: "2026-10-25"
description: >
  Keplerian elements with the true anomaly to the state: e = 0.999, TA = 150 deg.

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the conversion is the same in any inertial axes
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  central_body: "Earth"
  gm_km3_s2: 398600.4355070226    # BODY399_GM of data/gm_de440.tpc as CSPICE reads it (spec.md section 11)
  orbit:
    type: "keplerian_true_anomaly"
    a_km: 6999999.9999999935
    e: 0.999
    i_deg: 40.0
    raan_deg: 30.0
    argp_deg: 50.0
    ta_deg: 150.0

tolerances_override:
  position_km:
    abs_tol: 0.0
    rel_tol: 2.3e-13
    justification: >-
      e = 0.999: the state of the elements is ill-conditioned (the 1 - e^2 of the semilatus rectum, rounded alike by
      GMAT and the framework). Measured: E_ref 1.38e-14 relative (the golden against the 60-digit evaluation of
      spec.md 11.1), conditioning floor 1.1e-13 relative. T = ceil2(2 max(E_run, E_ref, floor)) = 2.3e-13.
  velocity_km_s:
    abs_tol: 0.0
    rel_tol: 1.2e-13
    justification: >-
      e = 0.999: the state of the elements is ill-conditioned (the 1 - e^2 of the semilatus rectum, rounded alike by
      GMAT and the framework). Measured: E_ref 7.03e-15 relative (the golden against the 60-digit evaluation of
      spec.md 11.1), conditioning floor 5.55e-14 relative. T = ceil2(2 max(E_run, E_ref, floor)) = 1.2e-13.

# Outputs left out of the golden (written by tools/gmat_goldens/generate.py; spec.md section 11):
#   every element output (semi_major_axis_km to declination_deg): outputs of a state_vector input
