id: "orbital_elements_inclination_gap_019"
schema_version: "v1"
version: "0.1.0"
category: "orbital_elements"
created: "2026-10-25"
description: >
  State to elements, inclination of 5e-9 rad: GMAT reports INC = 0 there, so the inclination, RAAN, AOP and argument
  of latitude come from the equinoctial parameters.

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the conversion is the same in any inertial axes
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  central_body: "Earth"
  gm_km3_s2: 398600.4355070226    # BODY399_GM of data/gm_de440.tpc as CSPICE reads it (spec.md section 11)
  orbit:
    type: "state_vector"
    position_km: [-6624.052821239644, 3824.3986794690104, 3.7662974701507304e-5]
    velocity_km_s: [-3.8397960643287306, -6.297345554662163, 7.272044988978326e-9]

# Outputs left out of the golden (written by tools/gmat_goldens/generate.py; spec.md section 11):
#   hyperbolic_anomaly_deg, hyperbolic_mean_anomaly_deg: defined for e > 1 only
#   position_km, velocity_km_s: outputs of an elements input
