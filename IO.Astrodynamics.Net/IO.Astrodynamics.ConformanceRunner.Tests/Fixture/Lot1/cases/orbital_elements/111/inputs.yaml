id: "orbital_elements_kep2cart_equatorial_111"
schema_version: "v1"
version: "0.1.0"
category: "orbital_elements"
created: "2026-10-25"
description: >
  Keplerian elements with the true anomaly to the state: equatorial prograde orbit (i = 0).

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the conversion is the same in any inertial axes
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  central_body: "Earth"
  gm_km3_s2: 398600.4355070226    # BODY399_GM of data/gm_de440.tpc as CSPICE reads it (spec.md section 11)
  orbit:
    type: "keplerian_true_anomaly"
    a_km: 8000.0
    e: 0.05
    i_deg: 0.0
    raan_deg: 0.0
    argp_deg: 120.0
    ta_deg: 30.0

# Outputs left out of the golden (written by tools/gmat_goldens/generate.py; spec.md section 11):
#   every element output (semi_major_axis_km to declination_deg): outputs of a state_vector input
