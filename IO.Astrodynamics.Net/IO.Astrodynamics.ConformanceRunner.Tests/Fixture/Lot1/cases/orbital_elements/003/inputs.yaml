id: "orbital_elements_nearcircular_003"
schema_version: "v1"
version: "0.1.0"
category: "orbital_elements"
created: "2026-10-25"
description: >
  State to elements, near-circular orbit (e = 1e-4): the angles measured from the periapsis are defined but
  ill-conditioned (floor about 1.2e-10 deg).

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the conversion is the same in any inertial axes
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  central_body: "Earth"
  gm_km3_s2: 398600.4355070226    # BODY399_GM of data/gm_de440.tpc as CSPICE reads it (spec.md section 11)
  orbit:
    type: "state_vector"
    position_km: [-743.287587938752, -6620.691165612703, 2146.87480742767]
    velocity_km_s: [6.825161837522472, -1.6600789395012319, -2.7586080901876233]

tolerances_override:
  argp_deg:
    abs_tol: 2.4e-10
    rel_tol: 0.0
    justification: >-
      Near-circular orbit (e = 1e-4): the angles measured from the periapsis are ill-conditioned. Measured: E_ref
      3.9e-11 deg (the golden against the 60-digit evaluation of spec.md 11.1), conditioning floor 1.18e-10 deg. T =
      ceil2(2 max(E_run, E_ref, floor)) = 2.4e-10.
  true_anomaly_deg:
    abs_tol: 2.4e-10
    rel_tol: 0.0
    justification: >-
      Near-circular orbit (e = 1e-4): the angles measured from the periapsis are ill-conditioned. Measured: E_ref
      3.9e-11 deg (the golden against the 60-digit evaluation of spec.md 11.1), conditioning floor 1.18e-10 deg. T =
      ceil2(2 max(E_run, E_ref, floor)) = 2.4e-10.
  eccentric_anomaly_deg:
    abs_tol: 2.4e-10
    rel_tol: 0.0
    justification: >-
      Near-circular orbit (e = 1e-4): the angles measured from the periapsis are ill-conditioned. Measured: E_ref
      3.9e-11 deg (the golden against the 60-digit evaluation of spec.md 11.1), conditioning floor 1.18e-10 deg. T =
      ceil2(2 max(E_run, E_ref, floor)) = 2.4e-10.
  mean_anomaly_deg:
    abs_tol: 2.4e-10
    rel_tol: 0.0
    justification: >-
      Near-circular orbit (e = 1e-4): the angles measured from the periapsis are ill-conditioned. Measured: E_ref
      3.9e-11 deg (the golden against the 60-digit evaluation of spec.md 11.1), conditioning floor 1.18e-10 deg. T =
      ceil2(2 max(E_run, E_ref, floor)) = 2.4e-10.
  longitude_of_periapsis_deg:
    abs_tol: 2.4e-10
    rel_tol: 0.0
    justification: >-
      Near-circular orbit (e = 1e-4): the angles measured from the periapsis are ill-conditioned. Measured: E_ref
      3.9e-11 deg (the golden against the 60-digit evaluation of spec.md 11.1), conditioning floor 1.18e-10 deg. T =
      ceil2(2 max(E_run, E_ref, floor)) = 2.4e-10.

# Outputs left out of the golden (written by tools/gmat_goldens/generate.py; spec.md section 11):
#   hyperbolic_anomaly_deg, hyperbolic_mean_anomaly_deg: defined for e > 1 only
#   position_km, velocity_km_s: outputs of an elements input
