id: "orbital_elements_kep2cart_e0p99_103"
schema_version: "v1"
version: "0.1.0"
category: "orbital_elements"
created: "2026-10-25"
description: >
  Keplerian elements with the true anomaly to the state: e = 0.99 with a periapsis radius of 7000 km.

metadata:
  ephemeris_kernel: "none"
  reference_frame: "ICRF"         # the conversion is the same in any inertial axes
  time_scale: "TDB"

inputs:
  epoch: "2021-03-20T12:00:00.000 TDB"
  central_body: "Earth"
  gm_km3_s2: 398600.4355070226    # BODY399_GM of data/gm_de440.tpc as CSPICE reads it (spec.md section 11)
  orbit:
    type: "keplerian_true_anomaly"
    a_km: 699999.9999999994
    e: 0.99
    i_deg: 40.0
    raan_deg: 30.0
    argp_deg: 50.0
    ta_deg: 90.0

tolerances_override:
  position_km:
    abs_tol: 0.0
    rel_tol: 2.2e-14
    justification: >-
      e = 0.99: the state of the elements is ill-conditioned (the 1 - e^2 of the semilatus rectum). Measured: E_ref
      5.71e-16 relative (the golden against the 60-digit evaluation of spec.md 11.1; GMAT R2026a run of 2026-10-25),
      conditioning floor 1.09e-14 relative, E_run linux 1.99e-16, windows 1.99e-16, macos 1.99e-16 (IO.Astrodynamics
      minus golden, 2026-10-25). T = ceil2(2 max(E_run, E_ref, floor)) = 2.2e-14.
  velocity_km_s:
    abs_tol: 0.0
    rel_tol: 1.2e-14
    justification: >-
      e = 0.99: the state of the elements is ill-conditioned (the 1 - e^2 of the semilatus rectum). Measured: E_ref
      4.16e-16 relative (the golden against the 60-digit evaluation of spec.md 11.1; GMAT R2026a run of 2026-10-25),
      conditioning floor 5.53e-15 relative, E_run linux 2.39e-16, windows 2.39e-16, macos 2.39e-16 (IO.Astrodynamics
      minus golden, 2026-10-25). T = ceil2(2 max(E_run, E_ref, floor)) = 1.2e-14.

# Outputs left out of the golden (written by tools/gmat_goldens/generate.py; spec.md section 11):
#   every element output (semi_major_axis_km to declination_deg): outputs of a state_vector input
