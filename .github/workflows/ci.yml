name: Astrodynamics CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "develop", "release/*", "hotfix/*" ]
  workflow_dispatch:
    inputs:
          logLevel:
            description: 'Log level'
            required: true
            default: 'minimal'
            type: choice
            options:
            - minimal
            - normal
            - detailed
            - diagnostic

env:
  BUILD_TYPE: Release

jobs:
  # Job 0: Documentation. Independent of the build, so it fails fast on a broken
  # link, a page missing from the nav, or a documented version that disagrees with
  # the projects, rather than at release time.
  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check documented versions
      run: tools/ci/check-versions.sh

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install MkDocs and dependencies
      run: pip install -r docs/requirements.txt

    - name: Build documentation
      run: mkdocs build --strict

  # Job 1: Build and test C++ native library on all platforms.
  # Both macOS arches build on the Apple Silicon runner: arm64 natively, x64 by
  # cross-compiling (GitHub's Intel macOS runners are retired/capacity-starved).
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14        # Apple Silicon — native arm64
            osx_arch: arm64
            osx_cc_arch: arm64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64 -DOSX_ARCH=arm64
          - os: macos-14        # Apple Silicon — cross-compiled x64
            osx_arch: x64
            osx_cc_arch: x86_64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DOSX_ARCH=x86_64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # SOFA has no prebuilt macOS archive: compile it from vendored source (for the
    # target arch) into the static lib the CMake APPLE branch links.
    - name: Build SOFA (macOS)
      if: matrix.osx_arch
      run: |
        cd external-lib/sofa-src
        # Compile library routines only; skip any t_*.c test drivers (they define main()).
        cc -arch ${{ matrix.osx_cc_arch }} -O2 -c $(ls *.c | grep -v '^t_')
        ar rcs ../libsofa_c_osx_${{ matrix.osx_arch }}.a *.o

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.cmake_extra }}

    - name: Build C++
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j 2

    - name: C++ Tests (Linux)
      working-directory: ${{github.workspace}}/build/IO.Astrodynamics.Tests
      run: ./IO.Astrodynamics.Tests
      if: matrix.os == 'ubuntu-latest'

    # Only the native arm64 build runs its tests; the x64 dylib is cross-compiled
    # (can't execute natively here) and is covered by the Linux/Windows x64 tests.
    - name: C++ Tests (macOS arm64)
      working-directory: ${{github.workspace}}/build/IO.Astrodynamics.Tests
      run: ./IO.Astrodynamics.Tests
      if: matrix.osx_arch == 'arm64'

    - name: C++ Tests (Windows)
      working-directory: ${{github.workspace}}\build\IO.Astrodynamics.Tests\Release
      shell: cmd
      run: IO.Astrodynamics.Tests.exe
      if: matrix.os == 'windows-latest'

    - name: Upload native library (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: native-linux
        path: build/IO.Astrodynamics/libIO.Astrodynamics.so
        retention-days: 1
      if: matrix.os == 'ubuntu-latest'

    - name: Upload native library (macOS)
      uses: actions/upload-artifact@v4
      with:
        name: native-osx-${{ matrix.osx_arch }}
        path: build/IO.Astrodynamics/libIO.Astrodynamics.dylib
        retention-days: 1
      if: matrix.osx_arch

    - name: Upload native library (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: native-windows
        path: |
          build/IO.Astrodynamics/Release/IO.Astrodynamics.dll
          build/IO.Astrodynamics/Release/IO.Astrodynamics.lib
        retention-days: 1
      if: matrix.os == 'windows-latest'

  # Job 2: Build and test .NET with freshly built native libraries.
  # macOS runs on Apple Silicon only — the arm64 .NET host can load the arm64
  # dylib; the x64 dylib is validated by the Linux/Windows x64 .NET jobs.
  # Tests in the Validation category (bit-for-bit goldens, heavy statistical validations) run on Linux only: a golden
  # holds on one platform, since the mathematical library differs between operating systems. Tests in the
  # LongValidation category (more than 5 min each) run in the manual workflow long-validation.yml only.
  build-dotnet:
    needs: build-native
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14        # Apple Silicon (arm64)
            osx_arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./IO.Astrodynamics.Net

    steps:
    - uses: actions/checkout@v4

    - name: Download native Linux library
      uses: actions/download-artifact@v4
      with:
        name: native-linux
        path: IO.Astrodynamics.Net/IO.Astrodynamics/resources
      if: matrix.os == 'ubuntu-latest'

    - name: Download native Windows library
      uses: actions/download-artifact@v4
      with:
        name: native-windows
        path: IO.Astrodynamics.Net/IO.Astrodynamics/resources
      if: matrix.os == 'windows-latest'

    # The resolver loads resources/libIO.Astrodynamics.dylib for the from-source build.
    - name: Download native macOS library
      uses: actions/download-artifact@v4
      with:
        name: native-osx-${{ matrix.osx_arch }}
        path: IO.Astrodynamics.Net/IO.Astrodynamics/resources
      if: matrix.osx_arch

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Test
      run: dotnet test --verbosity ${{ inputs.logLevel || 'minimal' }} -c Release ${{ matrix.os != 'ubuntu-latest' && '--filter "Category!=Validation&Category!=LongValidation"' || '--filter "Category!=LongValidation"' }}

  # Job 3: the conformance suite (conformance-tests, private) run by the conformance runner on its latest version, on
  # the three platforms, with freshly built native libraries. The suite is checked out with a read-only token, the
  # secret CONFORMANCE_TESTS_TOKEN (contents: read on conformance-tests); without it (forks), the job only says so.
  # Its kernels are in Git LFS. The exit code of the runner is the number of failed cases plus the number of errors.
  conformance:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14        # Apple Silicon (arm64)
            osx_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CONFORMANCE_TESTS_TOKEN: ${{ secrets.CONFORMANCE_TESTS_TOKEN }}
    defaults:
      run:
        working-directory: ./IO.Astrodynamics.Net
        shell: bash

    steps:
    - name: No access to the conformance suite
      if: env.CONFORMANCE_TESTS_TOKEN == ''
      working-directory: .
      run: echo "::notice::CONFORMANCE_TESTS_TOKEN is not set; the conformance suite is not run."

    - uses: actions/checkout@v4
      if: env.CONFORMANCE_TESTS_TOKEN != ''

    - name: Checkout the conformance suite
      if: env.CONFORMANCE_TESTS_TOKEN != ''
      uses: actions/checkout@v4
      with:
        repository: IO-Aerospace-software-engineering/conformance-tests
        token: ${{ secrets.CONFORMANCE_TESTS_TOKEN }}
        path: conformance-tests
        lfs: true

    - name: Download native Linux library
      uses: actions/download-artifact@v4
      with:
        name: native-linux
        path: IO.Astrodynamics.Net/IO.Astrodynamics/resources
      if: env.CONFORMANCE_TESTS_TOKEN != '' && matrix.os == 'ubuntu-latest'

    - name: Download native Windows library
      uses: actions/download-artifact@v4
      with:
        name: native-windows
        path: IO.Astrodynamics.Net/IO.Astrodynamics/resources
      if: env.CONFORMANCE_TESTS_TOKEN != '' && matrix.os == 'windows-latest'

    - name: Download native macOS library
      uses: actions/download-artifact@v4
      with:
        name: native-osx-${{ matrix.osx_arch }}
        path: IO.Astrodynamics.Net/IO.Astrodynamics/resources
      if: env.CONFORMANCE_TESTS_TOKEN != '' && matrix.osx_arch

    - name: Setup .NET
      if: env.CONFORMANCE_TESTS_TOKEN != ''
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run the conformance suite
      if: env.CONFORMANCE_TESTS_TOKEN != ''
      run: |
        dotnet run --project IO.Astrodynamics.ConformanceRunner -c Release -- \
          ../conformance-tests IO.Astrodynamics.Tests/Data/SolarSystem conformance-report-${{ matrix.os }}.json

    - name: Print the report
      if: always() && env.CONFORMANCE_TESTS_TOKEN != ''
      run: cat conformance-report-${{ matrix.os }}.json

    - name: Upload the report
      if: always() && env.CONFORMANCE_TESTS_TOKEN != ''
      uses: actions/upload-artifact@v4
      with:
        name: conformance-report-${{ matrix.os }}
        path: IO.Astrodynamics.Net/conformance-report-${{ matrix.os }}.json
        retention-days: 30
