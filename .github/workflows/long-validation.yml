name: Long validation

# The tests of the LongValidation category: validations and studies of minutes each (the Monte Carlo of F3 on R2 and
# R3, Foster against a Monte Carlo of the probability, the step study of F1, the reduced degree of the geopotential
# partials, the cost of the conjunction analysis; phase 2, feature 1), excluded from the CI and the CD (decisions of
# S. Guillet, 2026-10-06 and 2026-10-22). They are skipped unless IO_ASTRODYNAMICS_LONG_VALIDATION is 1, which this
# workflow sets. Run by hand, on Linux, with the native library built from the sources as in the CI: before each
# release, and on a pull request that changes the dynamics these tests measure.
on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  long-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build C++
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j 2

    - name: Copy the native library
      run: cp build/IO.Astrodynamics/libIO.Astrodynamics.so IO.Astrodynamics.Net/IO.Astrodynamics/resources/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./IO.Astrodynamics.Net
      run: dotnet restore

    - name: Test
      working-directory: ./IO.Astrodynamics.Net
      env:
        IO_ASTRODYNAMICS_LONG_VALIDATION: '1'
      run: dotnet test IO.Astrodynamics.Tests/IO.Astrodynamics.Tests.csproj -c Release --filter "Category=LongValidation" --logger "console;verbosity=detailed"
